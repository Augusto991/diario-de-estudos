<style>
:root{--bg:#101b16;--fg:#edf6f0;--card:#17231e;--secondary:#202e27;--muted:#a2b5aa;--primary:#70e39a;--danger:#ff7068;--border:#34453c;--sidebar:#0c1511;--r:8px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;padding:32px 16px;background-image:linear-gradient(#70e39a0b 1px,transparent 1px),linear-gradient(90deg,#70e39a0b 1px,transparent 1px);background-size:32px 32px}.login-grid{max-width:1050px;min-height:calc(100vh - 64px);margin:auto;display:grid;align-items:center;gap:40px;grid-template-columns:1.1fr .9fr}.hero h1{font-size:64px;line-height:1.02;margin:10px 0 0}.kicker{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--primary);letter-spacing:.08em}.hero p{color:var(--muted);line-height:1.7;max-width:450px}.logo{width:64px;height:64px;display:grid;place-items:center;border:1px solid #70e39a55;background:#70e39a18;border-radius:8px;font-size:30px;color:var(--primary)}.panel{border:1px solid var(--border);background:var(--card);padding:32px;border-radius:10px;box-shadow:0 24px 70px #0007}.panel h2{font-size:32px;margin:8px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--secondary);padding:4px;border-radius:7px;margin:24px 0}.tabs button,.btn{border:1px solid transparent;background:transparent;color:var(--fg);min-height:42px;padding:10px 14px;border-radius:6px;font-weight:700}.tabs button.active,.btn.primary{background:var(--primary);color:#102017}.btn.outline{border-color:var(--border);background:transparent}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.field{display:block;margin:18px 0}.field span{display:block;font-size:14px;font-weight:700;margin-bottom:8px}.input,.select{width:100%;height:42px;border:1px solid var(--border);border-radius:6px;background:#111b16;color:var(--fg);padding:0 12px;outline:none}.input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 2px #70e39a20}.error{min-height:20px;color:var(--danger);font-size:14px}.full{width:100%}.sidebar{position:fixed;z-index:40;inset:0 auto 0 0;width:288px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .2s}.sidebar-head{display:flex;align-items:center;gap:12px;padding:24px;border-bottom:1px solid var(--border)}.sidebar-head .mini-logo{width:40px;height:40px;display:grid;place-items:center;background:var(--primary);color:#102017;border-radius:6px;font-size:20px}.sidebar-head strong{font-size:18px}.sidebar-head small{display:block;color:#ffffff99;margin-top:3px}.nav{padding:20px 12px;flex:1}.nav-label{padding:0 12px 12px;color:#ffffff66;font-size:11px;font-weight:800;text-transform:uppercase}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#ffffffb5;padding:12px;border-radius:6px;font-weight:700;margin:2px 0}.nav button.active{background:#70e39a20;color:var(--primary);box-shadow:inset 3px 0 var(--primary)}.user-box{border-top:1px solid var(--border);padding:16px}.user-line{display:flex;gap:10px;align-items:center;margin-bottom:10px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#26372e;color:var(--primary);font-weight:800}.user-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted)}.main{margin-left:288px;min-height:100vh}.mobilebar{display:none;position:sticky;top:0;z-index:20;padding:12px 16px;border-bottom:1px solid var(--border);background:#101b16f2;backdrop-filter:blur(8px);align-items:center;justify-content:space-between}.content{max-width:1150px;margin:auto;padding:40px}.header{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:28px}.header h1{font-size:40px;margin:8px 0}.header p{margin:0;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}.surface{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:20px}.streak{background:linear-gradient(145deg,var(--card),#70e39a14)}.surface h2{font-size:24px;margin:6px 0}.stat{font-size:64px;font-weight:800;color:var(--primary);margin-top:20px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-top:22px}.metric{background:var(--card);padding:20px}.metric b{font-size:30px}.section{margin-top:24px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;margin:20px 0}.table-wrap{overflow:auto}.table{width:100%;min-width:650px;border-collapse:collapse;font-size:14px}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--border);text-align:left}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.grade{width:80px}.week-line{display:grid;grid-template-columns:105px 1fr;gap:16px;padding:17px 6px;border-bottom:1px solid var(--border)}.week-line.today{background:#70e39a10;border:1px solid #70e39a55;border-radius:6px;padding:16px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--border);background:var(--secondary);border-radius:99px;padding:5px 9px;font-size:12px}.date{display:flex;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}.datebox{width:52px;height:52px;display:grid;place-items:center;background:var(--secondary);border-radius:6px;line-height:1}.datebox b{font-size:18px}.datebox span{font-size:10px;color:var(--primary);text-transform:uppercase;font-weight:800}.roster{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);overflow:hidden;border-radius:6px}.roster-row{background:var(--card);display:grid;grid-template-columns:55px 1fr;align-items:center;gap:12px;padding:7px 12px;min-height:52px}.num{color:var(--primary);font-weight:800}.count{border:1px solid #70e39a55;color:var(--primary);background:#70e39a15;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.teachers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.teacher{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:6px;padding:16px;background:var(--card)}.teacher-icon{width:40px;height:40px;display:grid;place-items:center;background:#70e39a15;color:var(--primary);font-weight:800;border-radius:6px}.achievements{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.achievement{display:flex;gap:16px;align-items:center;border:1px solid var(--border);border-radius:9px;background:var(--card);padding:16px;opacity:.5}.achievement.unlocked{opacity:1;border-color:#70e39a80}.achievement-icon{width:48px;height:48px;display:grid;place-items:center;background:#70e39a15;color:var(--primary);border-radius:6px;font-size:22px}.achievement-status{margin-left:auto;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted)}.unlocked .achievement-status{color:var(--primary)}.empty{min-height:175px;display:grid;place-items:center;border:1px dashed var(--border);border-radius:6px;color:var(--muted);text-align:center}.backdrop{display:none;position:fixed;inset:0;z-index:30;background:#101b16bf;backdrop-filter:blur(3px)}
@media(max-width:1023px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.backdrop.open{display:block}.main{margin-left:0}.mobilebar{display:flex}.content{padding:28px 20px}.header{align-items:flex-start}.grid2{grid-template-columns:1fr}.hero{display:none}.login-grid{display:block;max-width:520px}.login-panel{margin:auto}.login{padding:20px 14px}.login-grid{min-height:calc(100vh - 40px)}}
@media(max-width:620px){.content{padding:22px 14px}.header h1{font-size:30px}.header{margin-bottom:22px}.surface{padding:16px}.toolbar{grid-template-columns:1fr}.week-line{grid-template-columns:1fr;gap:8px}.roster{grid-template-columns:1fr}.teachers,.achievements{grid-template-columns:1fr}.achievement{align-items:flex-start}.achievement-status{margin-left:auto}.panel{padding:20px}.stat{font-size:52px}.table{min-width:600px}}

<body>
<div id="root"></div>
<script>
(function(){'use strict';
const WEEK={Segunda:['Matemática','Português','História','Inglês','Ed. Física','Filosofia'],Terça:['Matemática','Português','Artes','Literatura','Sociologia','Ed. Financeira'],Quarta:['Matemática','Português','História','Análise de Texto','Inglês','Sociologia Gov. e Cid.'],Quinta:['Matemática','Português','Filosofia','Sociologia','Ed. Física','Artes'],Sexta:['Matemática','Português','Literatura','Análise de Texto','História','Ed. Financeira']};
const DATES=[['2026-10-12','Nossa Senhora Aparecida','Feriado'],['2026-10-13','Recesso — Dia do Professor','Recesso'],['2026-11-02','Finados','Feriado'],['2026-11-15','Proclamação da República','Feriado'],['2026-11-20','Dia da Consciência Negra','Feriado'],['2026-12-18','Encerramento do ano letivo','Letivo'],['2026-12-25','Natal','Feriado']];
const SUBJECTS=['Matemática','Português','Artes','Ed. Física','História','Inglês','Ed. Financeira','Filosofia','Sociologia','Análise de Texto','Literatura','Sociologia Gov. e Cid.','Física'];
const DEFAULT_TEACHERS={Matemática:'Daniela',Português:'Professor de Português',Artes:'Professor de Artes','Ed. Física':'Professor de Ed. Física',História:'Professor de História',Inglês:'Professor de Inglês','Ed. Financeira':'Professor de Ed. Financeira',Filosofia:'Professor de Filosofia',Sociologia:'Professor de Sociologia','Análise de Texto':'Professor de Análise de Texto',Literatura:'Professor de Literatura','Sociologia Gov. e Cid.':'Professor de Sociologia Gov. e Cid.',Física:'Nathaly'};
const TEACHER_ACCESS=SUBJECTS.map((subject,i)=>({subject,name:DEFAULT_TEACHERS[subject]||('Professor de '+subject),password:String(i+1)}));
const KEYS={roster:'diario2b-roster',teachers:'diario2b-teachers',week:'diario2b-week',assignments:'diario2b-assignments',grades:'diario2b-teacher-grades-v1'};
let state={session:null,profile:{streak:0,history:[],subjects:[]},roster:{},teachers:{...DEFAULT_TEACHERS},week:structuredClone(WEEK),assignments:[],tab:'inicio',menu:false};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}} function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
state.roster=read(KEYS.roster,{});state.teachers=read(KEYS.teachers,DEFAULT_TEACHERS);state.week=read(KEYS.week,WEEK);state.assignments=read(KEYS.assignments,[]);state.teacherGrades=read(KEYS.grades,{});
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function profileKey(number=state.session?.number){return `diario2b-profile-${number}`}
function normalizeProfile(profile){const base=profile&&typeof profile==='object'?profile:{streak:0,history:[],subjects:[]};const old=Array.isArray(base.subjects)?base.subjects:[];const byName=Object.fromEntries(old.map(s=>[String(s.name).trim().toLowerCase(),s]));base.subjects=SUBJECTS.map(name=>{const found=byName[name.toLowerCase()];return found?{...found,name,grades:Array.isArray(found.grades)?[found.grades[0]??'',found.grades[1]??'',found.grades[2]??'']:['','','']}:{id:Date.now()+Math.random(),name,grades:['','','']}});return base}
function loadProfile(){state.profile=normalizeProfile(read(profileKey(),{streak:0,history:[],subjects:[]}));saveProfile()}
function loadStudentProfile(number){const profile=normalizeProfile(read(profileKey(number),{streak:0,history:[],subjects:[]}));const saved=state.teacherGrades[String(number)]||{};profile.subjects.forEach(s=>{if(Array.isArray(saved[s.name]))s.grades=[saved[s.name][0]??'',saved[s.name][1]??'',saved[s.name][2]??'']});write(profileKey(number),profile);return profile}
function currentTeacher(){return state.session?.role==='professor'?TEACHER_ACCESS.find(t=>t.subject===state.session.subject):null}
function teacherOwns(subject){return state.session?.role==='professor'&&state.session.subject===subject}
function saveProfile(){write(profileKey(),state.profile)}
function saveTeacherGrade(number,subject,gradeIndex,value){const n=String(number);if(!state.teacherGrades[n])state.teacherGrades[n]={};if(!Array.isArray(state.teacherGrades[n][subject]))state.teacherGrades[n][subject]=['','',''];state.teacherGrades[n][subject][gradeIndex]=value;write(KEYS.grades,state.teacherGrades);const profile=loadStudentProfile(number);const target=profile.subjects.find(s=>s.name===subject);if(target){target.grades=[...state.teacherGrades[n][subject]];write(profileKey(number),profile)}}
function dayName(){return new Intl.DateTimeFormat('pt-BR',{weekday:'long'}).format(new Date()).replace(/^./,x=>x.toUpperCase())}
function btn(label,cls='',attrs=''){return `<button class="btn ${cls}" ${attrs}>${label}</button>`}
function login(){state.session=null;$('#root').innerHTML=`<main class="login"><div class="login-grid"><section class="hero"><div class="logo">📖</div><p class="kicker" style="margin-top:28px">Turma 2º B · 2026</p><h1>Seu diário de estudos, todos os dias.</h1><p>Notas, provas, trabalhos e acompanhamento da turma em um só lugar.</p></section><section class="panel login-panel"><div class="logo" style="width:48px;height:48px;font-size:23px">📖</div><p class="kicker" style="margin-top:22px">Acesso</p><h2>Quem está entrando?</h2><div class="tabs"><button id="alunoTab" class="active">👤 Aluno(a)</button><button id="profTab">🎓 Professor</button><button id="vipTab">🛡️ VIP</button></div><form id="loginForm"><label class="field"><span id="loginNameLabel">Seu nome</span><input id="loginName" class="input" placeholder="Digite seu nome" autocomplete="off"></label><div id="loginExtra"><label class="field"><span>Número da chamada</span><select id="loginNumber" class="select">${Array.from({length:40},(_,i)=>`<option value="${i+1}">Nº ${i+1}</option>`).join('')}</select></label></div><p id="loginError" class="error"></p>${btn('Entrar no diário →','primary full','type="submit"')}</form></section></div></main>`;let mode='aluno';const setMode=m=>{mode=m;['alunoTab','profTab','vipTab'].forEach(id=>$('#'+id).classList.toggle('active',id===(m==='aluno'?'alunoTab':m==='professor'?'profTab':'vipTab')));$('#loginError').textContent='';if(m==='aluno'){$('#loginNameLabel').textContent='Seu nome';$('#loginName').placeholder='Digite seu nome';$('#loginExtra').innerHTML='<label class="field"><span>Número da chamada</span><select id="loginNumber" class="select">'+Array.from({length:40},(_,i)=>`<option value="${i+1}">Nº ${i+1}</option>`).join('')+'</select></label>'}else{$('#loginNameLabel').textContent=m==='vip'?'Nome do VIP':'Nome do professor';$('#loginName').placeholder=m==='vip'?'Digite seu nome':'Digite seu nome';$('#loginExtra').innerHTML='<label class="field"><span>Senha</span><input id="loginPassword" class="input" type="password" inputmode="numeric" placeholder="Digite sua senha" autocomplete="current-password"></label>'}};$('#alunoTab').onclick=()=>setMode('aluno');$('#profTab').onclick=()=>setMode('professor');$('#vipTab').onclick=()=>setMode('vip');$('#loginForm').onsubmit=async e=>{e.preventDefault();const name=$('#loginName').value.trim();if(mode==='professor'){const password=$('#loginPassword').value.trim();const teacher=TEACHER_ACCESS.find(t=>t.password===password);if(!teacher){$('#loginError').textContent='Senha incorreta.';return}state.session={name:teacher.name,role:'professor',subject:teacher.subject};state.tab='notas-professor';render();return}if(mode==='vip'){const password=$('#loginPassword').value.trim();const passwordBytes=new TextEncoder().encode(password);const digest=await crypto.subtle.digest('SHA-256',passwordBytes);const passwordHash=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');if(passwordHash!=='ad57366865126e55649ecb23ae1d48887544976efea46a48eb5d85a6eeb4d306'){$('#loginError').textContent='Senha incorreta.';return}state.session={name:name||'VIP',role:'vip'};state.tab='inicio';render();return}if(!name){$('#loginError').textContent='Digite seu nome para continuar.';return}state.session={name,role:'aluno',number:Number($('#loginNumber').value)};state.roster[String(state.session.number)]=name;write(KEYS.roster,state.roster);state.tab='inicio';loadProfile();render()}}
function sidebar(){const isTeacher=state.session.role==='professor';const isVip=state.session.role==='vip';const nav=isTeacher?[['notas-professor','📝','Notas dos alunos'],['atividades-professor','📚','Provas e trabalhos']]:isVip?[['inicio','📖','Início'],['calendario','📅','Aulas e calendário'],['conquistas','🏆','Conquistas'],['turma','👥','Turma'],['professores','🎓','Professores']]:[['inicio','📖','Início'],['notas','📝','Notas'],['atividades','📚','Provas e trabalhos'],['calendario','📅','Calendário'],['conquistas','🏆','Conquistas'],['turma','👥','Turma'],['professores','🎓','Professores']];return `<div id="backdrop" class="backdrop ${state.menu?'open':''}"></div><aside class="sidebar ${state.menu?'open':''}"><div class="sidebar-head"><div class="mini-logo">📖</div><div style="min-width:0"><strong>Diário 2ºB</strong><small>${isTeacher?esc(state.session.subject):isVip?'Acesso VIP':'Ano letivo 2026'}</small></div><button id="closeMenu" class="btn ghost" style="margin-left:auto">✕</button></div><nav class="nav"><div class="nav-label">${isTeacher?'Área do professor':isVip?'Área VIP':'Menu principal'}</div>${nav.map(([id,ic,label])=>`<button class="${state.tab===id?'active':''}" data-tab="${id}">${ic}&nbsp;&nbsp;${label}</button>`).join('')}</nav><div class="user-box"><div class="user-line"><span class="avatar">${esc(state.session.name.charAt(0).toUpperCase())}</span><div style="min-width:0"><div class="user-name">${esc(state.session.name)}</div><small class="muted">${isTeacher?'Professor · '+esc(state.session.subject):isVip?'Acesso VIP':'Chamada nº '+state.session.number}</small></div></div><button id="logout" class="btn ghost full" style="text-align:left">↪ Sair</button></div></aside>`}
function render(){if(!state.session){login();return}$('#root').innerHTML=`${sidebar()}<main class="main"><div class="mobilebar"><button id="openMenu" class="btn outline">☰</button><b>Diário 2ºB</b><span style="color:var(--primary)">●</span></div><div class="content"><header class="header"><div><p class="kicker">Turma 2º B · 2026</p><h1>Olá, ${esc(state.session.name.split(' ')[0])}</h1><p>${state.session.role==='professor'?'Lance notas e organize provas e trabalhos da sua matéria.':state.session.role==='vip'?'Gerencie aulas, turma e professores.':'Organize sua rotina e acompanhe seu progresso.'}</p></div><div class="logo" style="width:48px;height:48px">🎓</div></header><div id="panel"></div></div></main>`;bindNav();renderPanel()}
function bindNav(){$('#openMenu').onclick=()=>{state.menu=true;render()};$('#closeMenu').onclick=()=>{state.menu=false;render()};$('#backdrop').onclick=()=>{state.menu=false;render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.menu=false;render()});$('#logout').onclick=()=>login()}
function renderPanel(){const p=$('#panel');if(state.session.role==='professor'){if(state.tab==='notas-professor')teacherGrades(p);if(state.tab==='atividades-professor')teacherAssignments(p);return}if(state.tab==='inicio')home(p);if(state.tab==='notas')notas(p);if(state.tab==='atividades')studentAssignments(p);if(state.tab==='calendario')calendar(p);if(state.tab==='conquistas')achievements(p);if(state.tab==='turma')roster(p);if(state.tab==='professores')teachers(p)}
function home(el){const marked=state.profile.history.includes(today());const totals=state.profile.subjects.map(s=>s.grades.reduce((a,v)=>a+(Number(v)||0),0));const filled=state.profile.subjects.flatMap(s=>s.grades).filter(v=>v!=='').length;el.innerHTML=`<div class="grid2"><article class="surface streak"><p class="kicker">Sequência atual</p><div class="stat">${state.profile.streak}</div><p class="muted">dias seguidos estudando</p>${btn(marked?'Estudo de hoje registrado':'Marquei que estudei hoje','primary full','id="markToday" '+(marked?'disabled':''))}</article><article class="surface"><p class="kicker">Visão geral</p><h2>Seu desempenho</h2><div class="metrics"><div class="metric"><b>${state.profile.subjects.length}</b><div class="muted">Matérias</div></div><div class="metric"><b>${filled}</b><div class="muted">Notas lançadas</div></div></div><button class="btn primary full" style="margin-top:16px" data-tab="notas">📝 Abrir minhas notas</button></article></div><section class="surface section"><p class="kicker">Resumo</p><h2>Suas matérias</h2><p class="muted">Todas as matérias da turma ficam organizadas na aba <b>Notas</b>, onde você pode lançar as notas de cada trimestre.</p><div class="chips" style="margin-top:16px">${state.profile.subjects.map(s=>`<span class="chip">${esc(s.name)}</span>`).join('')}</div></section>`;$('#markToday')?.addEventListener('click',()=>{state.profile.streak++;state.profile.history.push(today());saveProfile();renderPanel()});document.querySelector('[data-tab="notas"]')?.addEventListener('click',()=>{state.tab='notas';render()})}
function notas(el){const totalGeral=state.profile.subjects.reduce((sum,s)=>sum+s.grades.reduce((a,v)=>a+(Number(v)||0),0),0);const lancadas=state.profile.subjects.reduce((sum,s)=>sum+s.grades.filter(v=>v!=='').length,0);const mediaGeral=lancadas?(totalGeral/lancadas).toFixed(1):'—';el.innerHTML=`<section class="surface"><div style="display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap"><div><p class="kicker">Boletim do aluno</p><h2>Notas</h2><p class="muted">Todas as ${state.profile.subjects.length} matérias e as notas lançadas pelos professores.</p></div><div class="metrics" style="min-width:360px;margin:0"><div class="metric"><b>${totalGeral.toFixed(1)}</b><div class="muted">Total</div></div><div class="metric"><b>${mediaGeral}</b><div class="muted">Média das notas lançadas</div></div></div></div><div class="table-wrap" style="margin-top:22px"><table class="table"><thead><tr><th>Matéria</th><th>1º Tri</th><th>2º Tri</th><th>3º Tri</th><th>Total</th><th>Média</th></tr></thead><tbody>${state.profile.subjects.map(s=>{const total=s.grades.reduce((a,v)=>a+(Number(v)||0),0);const count=s.grades.filter(v=>v!=='').length;const media=count?(total/count).toFixed(1):'—';return `<tr><td><b>${esc(s.name)}</b></td>${s.grades.map(g=>`<td>${g===''?'<span class="muted">—</span>':`<b>${esc(g)}</b>`}</td>`).join('')}<td><b style="color:var(--primary)">${total.toFixed(1)}</b></td><td><b>${media}</b></td></tr>`}).join('')}</tbody></table></div><p class="muted" style="margin-top:14px;font-size:12px">As notas são lançadas pelos professores e ficam salvas neste dispositivo para aparecerem novamente quando o aluno entrar.</p></section>`}
function teacherGrades(el){const teacher=currentTeacher();const students=Array.from({length:40},(_,i)=>({number:i+1,name:state.roster[String(i+1)]||''}));el.innerHTML=`<section class="surface"><p class="kicker">Área do professor</p><h2>Notas — ${esc(teacher.subject)}</h2><p class="muted">Lance as notas dos alunos. As alterações são gravadas diretamente no boletim de cada aluno.</p><div class="table-wrap" style="margin-top:22px"><table class="table"><thead><tr><th>Nº</th><th>Aluno</th><th>1º Tri</th><th>2º Tri</th><th>3º Tri</th><th>Total</th><th>Média</th></tr></thead><tbody>${students.map(st=>{const profile=loadStudentProfile(st.number);const subject=profile.subjects.find(s=>s.name===teacher.subject);const grades=subject?.grades||['','',''];const total=grades.reduce((a,v)=>a+(Number(v)||0),0);const count=grades.filter(v=>v!=='').length;return `<tr><td><b>${st.number}</b></td><td><b>${esc(st.name||'Aluno não cadastrado')}</b></td>${grades.map((g,gi)=>`<td><input class="input teacher-grade" data-student="${st.number}" data-grade-index="${gi}" type="number" min="0" max="10" step="0.1" value="${esc(g)}" placeholder="—" ${st.name?'':'disabled'}></td>`).join('')}<td><b class="teacher-total">${total.toFixed(1)}</b></td><td><b class="teacher-media">${count?(total/count).toFixed(1):'—'}</b></td></tr>`}).join('')}</tbody></table></div></section>`;document.querySelectorAll('.teacher-grade').forEach(input=>input.oninput=()=>{const n=Number(input.dataset.student);const gi=Number(input.dataset.gradeIndex);const profile=loadStudentProfile(n);const subject=profile.subjects.find(s=>s.name===teacher.subject);if(!subject)return;subject.grades[gi]=input.value;saveTeacherGrade(n,teacher.subject,gi,input.value);const row=input.closest('tr');const vals=subject.grades;const total=vals.reduce((a,v)=>a+(Number(v)||0),0);const count=vals.filter(v=>v!=='').length;row.querySelector('.teacher-total').textContent=total.toFixed(1);row.querySelector('.teacher-media').textContent=count?(total/count).toFixed(1):'—'})}
function teacherAssignments(el){const teacher=currentTeacher();const mine=state.assignments.filter(a=>a.subject===teacher.subject);el.innerHTML=`<div class="grid2"><section class="surface"><p class="kicker">Nova atividade</p><h2>Prova ou trabalho</h2><form id="assignmentForm"><label class="field"><span>Tipo</span><select id="assignmentType" class="select"><option>Prova</option><option>Trabalho</option></select></label><label class="field"><span>Título</span><input id="assignmentTitle" class="input" required placeholder="Ex.: Prova do 2º trimestre"></label><label class="field"><span>Data de entrega</span><input id="assignmentDate" class="input" type="date" required></label><label class="field"><span>Descrição / instruções</span><textarea id="assignmentDesc" class="input" style="height:110px;padding:10px;resize:vertical" placeholder="Explique o que os alunos precisam fazer..."></textarea></label><button class="btn primary full" type="submit">➕ Publicar para os alunos</button></form></section><section class="surface"><p class="kicker">Publicadas</p><h2>${mine.length} atividade${mine.length===1?'':'s'}</h2><div style="margin-top:16px">${mine.length?mine.map(a=>`<article class="date" style="align-items:flex-start"><div class="datebox"><b>${new Date(a.date+'T12:00:00').getDate()}</b><span>${new Date(a.date+'T12:00:00').toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</span></div><div style="flex:1"><b>${esc(a.type)} — ${esc(a.title)}</b><div class="muted" style="font-size:12px;margin-top:5px">Entrega: ${new Date(a.date+'T12:00:00').toLocaleDateString('pt-BR')}</div><p class="muted" style="font-size:13px;line-height:1.5">${esc(a.description||'Sem descrição.')}</p><button class="btn danger" data-delete-assignment="${a.id}">Excluir</button></div></article>`).join(''):'<p class="muted">Nenhuma prova ou trabalho publicado ainda.</p>'}</div></section></div>`;$('#assignmentForm').onsubmit=e=>{e.preventDefault();state.assignments.push({id:Date.now(),subject:teacher.subject,type:$('#assignmentType').value,title:$('#assignmentTitle').value.trim(),date:$('#assignmentDate').value,description:$('#assignmentDesc').value.trim()});write(KEYS.assignments,state.assignments);renderPanel()};document.querySelectorAll('[data-delete-assignment]').forEach(b=>b.onclick=()=>{state.assignments=state.assignments.filter(a=>String(a.id)!==b.dataset.deleteAssignment);write(KEYS.assignments,state.assignments);renderPanel()})}
function studentAssignments(el){const items=state.assignments.slice().sort((a,b)=>a.date.localeCompare(b.date));el.innerHTML=`<section class="surface"><p class="kicker">Agenda acadêmica</p><h2>Provas e trabalhos</h2><p class="muted">Aqui aparecem as atividades publicadas pelos seus professores.</p><div style="margin-top:18px">${items.length?items.map(a=>`<article class="date" style="align-items:flex-start"><div class="datebox"><b>${new Date(a.date+'T12:00:00').getDate()}</b><span>${new Date(a.date+'T12:00:00').toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</span></div><div><b>${esc(a.type)} — ${esc(a.title)}</b><div class="muted" style="font-size:12px;margin-top:4px">${esc(a.subject)} · Entrega: ${new Date(a.date+'T12:00:00').toLocaleDateString('pt-BR')}</div><p class="muted" style="line-height:1.5">${esc(a.description||'Sem descrição.')}</p></div></article>`).join(''):'<p class="muted">Nenhuma prova ou trabalho foi publicado ainda.</p>'}</div></section>`}
function calendar(el){const editable=state.session.role==='vip';el.innerHTML=`<div class="grid2" style="grid-template-columns:1.15fr .85fr"><section class="surface"><p class="kicker">Horários</p><h2>Aulas da semana</h2>${editable?'<p class="kicker" style="margin-top:8px">Modo VIP: edite as aulas diretamente.</p>':''}<div style="margin-top:18px">${Object.entries(state.week).map(([day,classes])=>`<div class="week-line ${day===dayName()?'today':''}"><div><b>${day}</b>${day===dayName()?'<div class="kicker" style="margin-top:4px">Hoje</div>':''}</div><div class="chips">${classes.map((s,i)=>editable?`<input class="input" style="height:34px;width:160px" data-week="${day}:${i}" value="${esc(s)}">`:`<span class="chip">${esc(s)}</span>`).join('')}</div></div>`).join('')}</div></section><section class="surface"><p class="kicker">Agenda</p><h2>Próximas datas</h2><div style="margin-top:18px">${DATES.map(d=>{const dt=new Date(d[0]+'T12:00:00');return `<div class="date"><div class="datebox"><b>${dt.getDate()}</b><span>${dt.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</span></div><div><b>${esc(d[1])}</b><div class="muted" style="font-size:12px;margin-top:4px">${d[2]}</div></div></div>`}).join('')}</div></section></div>`;if(editable)document.querySelectorAll('[data-week]').forEach(i=>i.oninput=()=>{const [d,n]=i.dataset.week.split(':');state.week[d][Number(n)]=i.value;write(KEYS.week,state.week)})}
function roster(el){const editable=state.session.role==='vip';const count=Object.values(state.roster).filter(Boolean).length;el.innerHTML=`<section class="surface"><div style="display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px"><div><p class="kicker">Turma 2º B</p><h2>Lista de chamada</h2><p class="muted" style="font-size:13px">${count} nome${count===1?'':'s'} salvo${count===1?'':'s'} neste navegador.</p></div><span class="count">${count}/40</span></div><div class="roster">${Array.from({length:40},(_,i)=>{const n=i+1,name=state.roster[n]||'';return `<div class="roster-row"><span class="num">${String(n).padStart(2,'0')}</span>${editable?`<input class="input" data-roster="${n}" value="${esc(name)}" placeholder="Nome do aluno">`:`<span class="${name?'':'muted'}">${esc(name||'Nome ainda não cadastrado')}</span>`}</div>`}).join('')}</div></section>`;if(editable)document.querySelectorAll('[data-roster]').forEach(i=>i.oninput=()=>{state.roster[i.dataset.roster]=i.value;write(KEYS.roster,state.roster)})}
function teachers(el){const editable=state.session.role==='vip';el.innerHTML=`<section class="surface"><p class="kicker">Equipe docente</p><h2>Professores por matéria</h2><div class="teachers">${SUBJECTS.map(s=>`<div class="teacher"><div class="teacher-icon">${esc(s.charAt(0))}</div><div style="min-width:0;flex:1"><div class="muted" style="font-size:12px">${esc(s)}</div>${editable?`<input class="input" data-teacher="${esc(s)}" value="${esc(state.teachers[s]||'')}" placeholder="Nome do professor" style="margin-top:5px">`:`<b>${esc(state.teachers[s]||'Não cadastrado')}</b>`}</div></div>`).join('')}</div></section>`;if(editable)document.querySelectorAll('[data-teacher]').forEach(i=>i.oninput=()=>{state.teachers[i.dataset.teacher]=i.value;write(KEYS.teachers,state.teachers)})}
function achievements(el){const a=[['🔥','Primeira sequência','3 dias seguidos',state.profile.streak>=3],['📅','Uma semana','5 dias seguidos',state.profile.streak>=5],['📖','Grade organizada','5 matérias cadastradas',state.profile.subjects.length>=5],['🏆','Nota máxima','Uma nota 10',state.profile.subjects.some(s=>s.grades.some(g=>Number(g)===10))]];el.innerHTML=`<section><p class="kicker">Seu progresso</p><h2>Conquistas</h2><div class="achievements">${a.map(x=>`<article class="achievement ${x[3]?'unlocked':''}"><span class="achievement-icon">${x[0]}</span><div><b>${x[1]}</b><div class="muted" style="font-size:13px;margin-top:4px">${x[2]}</div></div><span class="achievement-status">${x[3]?'Conquistado':'Bloqueado'}</span></article>`).join('')}</div></section>`}
login();
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script>
